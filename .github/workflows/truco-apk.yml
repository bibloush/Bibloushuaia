name: Compilar APK Anotador Truco

on:
  push:
    branches:
      - truco-anotador
    paths:
      - 'truco-anotador/**'
      - '.github/workflows/truco-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar herramientas Android preinstaladas
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Descargar imagen y musica de dominio publico o licencia libre
        shell: bash
        run: |
          set -euo pipefail
          DEST="truco-anotador/app/src/main/assets"
          curl --fail --location --retry 4 --retry-delay 3 --user-agent "AnotadorTrucoHeber/1.1" "https://upload.wikimedia.org/wikipedia/commons/c/c9/Les_Eclaireurs_Lighthouse_Ushuaia.jpg" --output "$DEST/faro_fin_del_mundo.jpg"
          curl --fail --location --retry 4 --retry-delay 3 --user-agent "AnotadorTrucoHeber/1.1" "https://upload.wikimedia.org/wikipedia/commons/1/12/El_Choclo-Villoldo.ogg" --output "$DEST/musica_fondo.ogg"
          test "$(file -b --mime-type "$DEST/faro_fin_del_mundo.jpg")" = "image/jpeg"
          test "$(file -b --mime-type "$DEST/musica_fondo.ogg")" = "audio/ogg"
      - name: Compilar APK debug instalable
        working-directory: truco-anotador
        run: gradle --no-daemon assembleDebug
      - name: Preparar APK descargable
        run: |
          mkdir -p dist
          cp truco-anotador/app/build/outputs/apk/debug/app-debug.apk dist/Anotador-Truco.apk
      - name: Publicar artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Anotador-Truco-APK-v1.1
          path: dist/Anotador-Truco.apk
          retention-days: 90
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view truco-v1.1 >/dev/null 2>&1; then
            gh release upload truco-v1.1 dist/Anotador-Truco.apk --clobber
          else
            gh release create truco-v1.1 dist/Anotador-Truco.apk \
              --target truco-anotador \
              --title "Anotador Truco v1.1 - Heber Frau" \
              --notes "Anotador de 15 o 30 puntos con faro Les Eclaireurs y tango El Choclo, de dominio publico. Foto: Justraveling.com (CC BY-SA 4.0)."
          fi