plugins { id 'com.android.application' }

android {
    namespace 'ar.heberfrau.truco'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.heberfrau.truco'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['mp3']
    }
}
