<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b160e"><title>Anotador Truco</title>
<style>
:root{color-scheme:dark;--gold:#c4a45d;--cream:#f3e8d0;--wood:#301c12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:#fff;font-family:Arial,Helvetica,sans-serif;background:#11202a;overflow:hidden;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(to bottom,#101c2bb0,#0a1425b6 48%,#020710d4),url('faro_fin_del_mundo.jpg') center / cover no-repeat;}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,transparent 35%,#0008 100%);pointer-events:none}
.app{height:100dvh;min-height:550px;display:flex;flex-direction:column;position:relative}
header{height:88px;flex:none;border-bottom:2px solid #977340;background:
linear-gradient(180deg,#0c1926ea,#152334de);display:flex;justify-content:space-between;align-items:center;padding:12px 23px 4px}
header h1{font-size:clamp(23px,6.7vw,34px);font-weight:600;color:#ffca28;margin:0;letter-spacing:.3px;text-shadow:0 1px 1px #120b07}
.circle-menu{width:42px;height:42px;border:1.6px solid var(--gold);border-radius:50%;display:flex;justify-content:center;align-items:center;background:#180f0b44;color:var(--gold);font-size:25px;cursor:pointer}
.board{flex:1;min-height:0;position:relative;padding-top:12px}
.score-area{position:relative;margin:0 auto;width:62%;max-width:315px;display:flex;flex-direction:column}
.column-heads{display:grid;grid-template-columns:1fr 1fr;text-align:center;gap:0;border-bottom:2px solid #8f683f;padding:0 0 8px}
.col-name{font-size:clamp(27px,7vw,36px);line-height:1.15;font-weight:400}
.score-value{font-size:15px;letter-spacing:.8px;color:#e8cc8d;margin-top:3px}
.tallies{display:grid;grid-template-columns:1fr 1fr;position:relative}
.tallies::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:#aa8050ad}
.team{display:flex;flex-direction:column;align-items:center;padding-top:11px;min-width:0}
.sticks{width:58px;height:62px;display:flex;align-items:center;justify-content:center;flex:none;margin:2px 0}
.sticks svg{display:block;width:58px;height:58px;overflow:visible}
.split-line{width:100%;height:2px;background:#936b40;grid-column:1/-1;margin:5px 0}
.controls{position:absolute;top:31%;display:flex;flex-direction:column;gap:12px;align-items:center}
.controls.left{left:max(11px,6vw)}.controls.right{right:max(11px,6vw)}
.score-btn{border:3px solid white;color:white;background:#160c0855;border-radius:50%;width:clamp(53px,11vw,72px);height:clamp(53px,11vw,72px);font-size:52px;font-weight:200;line-height:42px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 1px 2px #0008}
.score-btn:active{transform:scale(.94);background:#a5803155}
.score-btn[disabled]{opacity:.35}
footer{flex:none;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;padding:0 10px max(16px,env(safe-area-inset-bottom));height:132px;gap:14px}
.new-btn{border:2px solid var(--gold);border-radius:12px;background:#190e09;color:white;padding:12px 25px;font-size:clamp(21px,6vw,27px);font-weight:500;box-shadow:0 2px 7px #0009;cursor:pointer}
.signature{font-size:13px;letter-spacing:.6px;color:#e3c58b;text-shadow:0 1px 3px black}
.menu{position:absolute;z-index:10;right:14px;top:79px;width:min(295px,88vw);background:#24140ef5;border:1px solid #be985a;border-radius:14px;box-shadow:0 12px 35px #000b;padding:18px;display:none}
.menu.show{display:block}
.menu h2{font-size:22px;color:#f5c54c;margin:0 0 17px;font-weight:500}
.menu-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0;border-top:1px solid #69482b}
.menu-row span{font-size:16px}
.option-btn{background:#4c2d1a;color:#fff3d5;border:1px solid #ba9152;border-radius:8px;padding:9px 12px;font-size:15px;cursor:pointer;min-width:80px}
.modes{display:flex;gap:5px}.option-btn.selected{background:#af8538;color:#1b100a;font-weight:700}
.winner{position:absolute;z-index:8;left:14px;right:14px;bottom:165px;background:#1b100bea;border:2px solid #d1ae5e;color:#ffe8b3;border-radius:15px;padding:15px;text-align:center;box-shadow:0 12px 35px #000a;display:none}
.winner.show{display:block}.winner strong{font-size:22px}
.winner button{display:block;margin:9px auto 0}
@media(max-height:700px){header{height:71px;padding-top:4px}.board{padding-top:7px}.team{padding-top:3px}.sticks{height:47px;margin:0}.sticks svg{height:46px;width:46px}footer{height:100px;gap:5px}.new-btn{padding:9px 15px}.menu{top:64px}}
@media(max-height:585px){.sticks{height:39px}.sticks svg{height:38px;width:38px}.col-name{font-size:24px}.score-area{width:58%}footer{height:85px}}
</style></head><body>
<div class="app">
<header><button class="circle-menu" aria-label="Deshacer último punto" onclick="undo()">&#x21b6;</button><h1>Anotador Truco</h1><button class="circle-menu" aria-label="Abrir menú" onclick="toggleMenu()">&#9776;</button></header>
<div class="board">
<div class="score-area">
<div class="column-heads"><div><div class="col-name">Nos:</div><div class="score-value" id="score-nos">0 puntos</div></div><div><div class="col-name">Ellos:</div><div class="score-value" id="score-ellos">0 puntos</div></div></div>
<div class="tallies" id="tallies">
<div class="team" id="team-nos-top"></div><div class="team" id="team-ellos-top"></div>
<div class="split-line"></div>
<div class="team" id="team-nos-bottom"></div><div class="team" id="team-ellos-bottom"></div>
</div>
</div>
<div class="controls left"><button class="score-btn" id="plus-nos" aria-label="Sumar punto a nosotros" onclick="point('nos',1)">+</button><button class="score-btn" id="minus-nos" aria-label="Restar punto a nosotros" onclick="point('nos',-1)">&minus;</button></div>
<div class="controls right"><button class="score-btn" id="plus-ellos" aria-label="Sumar punto a ellos" onclick="point('ellos',1)">+</button><button class="score-btn" id="minus-ellos" aria-label="Restar punto a ellos" onclick="point('ellos',-1)">&minus;</button></div>
<div class="winner" id="winner"><strong id="winner-text"></strong><button class="option-btn" onclick="newGame()">Nuevo partido</button></div>
<div class="menu" id="menu"><h2>Configuración</h2>
<div class="menu-row"><span>Música de fondo</span><button id="music-button" class="option-btn" onclick="toggleMusic()">Sonido: Sí</button></div>
<div class="menu-row"><span>Partido a</span><div class="modes"><button class="option-btn" id="goal15" onclick="setGoal(15)">15</button><button class="option-btn" id="goal30" onclick="setGoal(30)">30</button></div></div>
<div class="menu-row"><span>Deshacer último tanto</span><button class="option-btn" onclick="undo();toggleMenu(false)">Deshacer</button></div>
<div class="menu-row"><span style="font-size:11px;line-height:1.4;color:#e4d6b8">Foto: Justraveling.com · <a style="color:#e4d6b8" href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a><br>Música: El Choclo (1907), dominio público</span></div>
</div>
</div>
<footer><button class="new-btn" onclick="newGame()">Nuevo partido</button><div class="signature">Hecha por Heber Frau</div></footer>
</div>
<script>
(function(){
"use strict";
var state={nos:0,ellos:0,goal:30,history:[]};var music=true;
try{var s=JSON.parse(localStorage.getItem("truco_heber_estado"));if(s&&typeof s==="object"){state.nos=Math.max(0,Math.min(30,Number(s.nos)||0));state.ellos=Math.max(0,Math.min(30,Number(s.ellos)||0));state.goal=s.goal===15?15:30;state.history=Array.isArray(s.history)?s.history.slice(-100):[]}}catch(e){}
try{if(window.TrucoNative)music=window.TrucoNative.isMusicEnabled()}catch(e){}
function save(){try{localStorage.setItem("truco_heber_estado",JSON.stringify(state))}catch(e){}}
function matchSvg(count){
var p=[[[13,13],[52,13]],[[52,13],[52,51]],[[52,51],[13,51]],[[13,51],[13,13]],[[13,51],[52,13]]];
var s='<svg viewBox="0 0 65 65" role="img" aria-label="'+count+' de 5 tantos">';
for(var i=0;i<count;i++){var a=p[i][0],b=p[i][1];
s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#100904" stroke-width="7" stroke-linecap="round"/>';
s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#d4b889" stroke-width="5" stroke-linecap="round"/>';
s+='<line x1="'+(a[0]+1)+'" y1="'+(a[1]-1)+'" x2="'+(b[0]+1)+'" y2="'+(b[1]-1)+'" stroke="#fff0be" stroke-width="1.5" stroke-linecap="round"/>';
s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.7" fill="#b32719"/><circle cx="'+(a[0]-.6)+'" cy="'+(a[1]-.7)+'" r="1.5" fill="#fa8b64"/>';
}
return s+'</svg>';
}
function drawTeam(id,value,from,to){var node=document.getElementById(id);var content="";for(var i=from;i<to;i++){var n=Math.min(5,Math.max(0,value-5*i));content+='<div class="sticks">'+(n?matchSvg(n):"")+'</div>'}node.innerHTML=content}
function render(){
state.nos=Math.min(state.goal,state.nos);state.ellos=Math.min(state.goal,state.ellos);
document.getElementById("score-nos").textContent=state.nos+" / "+state.goal;
document.getElementById("score-ellos").textContent=state.ellos+" / "+state.goal;
drawTeam("team-nos-top",state.nos,0,3);drawTeam("team-ellos-top",state.ellos,0,3);
drawTeam("team-nos-bottom",state.nos,3,6);drawTeam("team-ellos-bottom",state.ellos,3,6);
document.getElementById("plus-nos").disabled=state.nos>=state.goal;
document.getElementById("plus-ellos").disabled=state.ellos>=state.goal;
document.getElementById("minus-nos").disabled=state.nos<=0;
document.getElementById("minus-ellos").disabled=state.ellos<=0;
document.getElementById("goal15").classList.toggle("selected",state.goal===15);
document.getElementById("goal30").classList.toggle("selected",state.goal===30);
document.getElementById("music-button").textContent="Sonido: "+(music?"Sí":"No");
var winner=state.nos>=state.goal?"¡Ganamos nosotros!":state.ellos>=state.goal?"¡Ganaron ellos!":"";
document.getElementById("winner").classList.toggle("show",!!winner);
document.getElementById("winner-text").textContent=winner;
save();
}
window.point=function(team,delta){var prev=state[team];var next=Math.max(0,Math.min(state.goal,prev+delta));if(prev===next)return;state.history.push({team:team,prev:prev});if(state.history.length>100)state.history.shift();state[team]=next;render();if(navigator.vibrate)navigator.vibrate(15)};
window.undo=function(){var last=state.history.pop();if(!last)return;state[last.team]=Math.min(state.goal,Math.max(0,last.prev));render()};
window.newGame=function(){if((state.nos||state.ellos)&&!confirm("¿Empezar un partido nuevo? Se borrarán los tantos actuales."))return;state.nos=0;state.ellos=0;state.history=[];document.getElementById("menu").classList.remove("show");render()};
window.toggleMenu=function(force){var node=document.getElementById("menu");if(typeof force==="boolean")node.classList.toggle("show",force);else node.classList.toggle("show")};
window.setGoal=function(goal){if(goal===state.goal)return;if((state.nos||state.ellos)&&!confirm("Cambiar a "+goal+" puntos reiniciará el partido. ¿Continuar?"))return;state.goal=goal;state.nos=0;state.ellos=0;state.history=[];render()};
window.toggleMusic=function(){music=!music;try{if(window.TrucoNative)window.TrucoNative.setMusicEnabled(music)}catch(e){}render()};
render();
})();
</script>
</body></html>
